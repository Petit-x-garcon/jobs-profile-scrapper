[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.1",
    "asyncpg>=0.32.0",
    "beautifulsoup4>=4.15.0",
    "celery>=5.7.0",
    "fastapi[standard]>=0.162.6",
    "httpx>=0.28.1",
    "lxml>=6.1.3",
    "openai>=3.50.0",
    "packaging>=26.3",
    "pydantic-settings>=2.16.3",
    "redis>=8.1.0",
    "sqlalchemy[asyncio]>=2.1.8",
]

[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "respx>=0.23.1",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # FastAPI Depends() defaults
